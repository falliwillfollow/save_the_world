kind: ScaleProfile
id: micro_commons_scale_targets_v0
provisional: true
base_households: 5
targets:
  - households: 5
    people: 12
    label: Base micro-commons
    notes: Current recommended minimum-dignity proof-of-concept scale.
  - people: 150
    label: 150-person commons
    notes: Tests whether the model can scale from a micro-commons into a small settlement without hiding repeated infrastructure, labor, governance, and review load.
  - people: 1500
    label: 1500-person commons
    notes: Tests whether the pattern family breaks into neighborhood-scale clusters, new topology, and institutional governance needs.
assumptions:
  - id: proportional_population
    description: Population scales from the 12-person baseline until a richer household generator exists.
    provisional: true
  - id: shared_reserve_scaling
    description: Shared reserve capacities scale with household count unless a pattern declares step scaling.
    provisional: true
  - id: review_locks_persist
    description: Health, food-safety, electrical, legal, engineering, and consent locks do not disappear when scaled.
    provisional: true
unknowns:
  - Scaling targets are topology probes, not site plans or community design.
  - Household counts at 150 and 1500 people are estimated from the current population ratio and should be replaced by explicit household generators.
  - Real scaling may require multiple clusters, new access routes, legal structures, and qualified review.
  - Costs, labor, and reserve footprints are provisional pressure signals only.
