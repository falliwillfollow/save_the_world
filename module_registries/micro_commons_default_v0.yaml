kind: ModuleRegistry
id: micro_commons_default_v0
status: active
provisional: true
default_posture: Use boring, inspectable minimum-dignity infrastructure as the baseline; research modules may only replace or augment slots when dignity floors remain protected.
flourishing_posture:
  frame: Abundance of basic living needs should reduce routine coercion, scarcity bargaining, and dependence on adversarial services.
  principles:
    - basic food, water, shelter, sanitation, critical energy, access, care-adjacent support, time, and belonging are treated as abundant civic floors before optimization
    - governance and legal structure should be thin boundary infrastructure, not the operating center of daily life
    - conflict services exist for edge cases, repair, and safety, but the primary design move is removing scarcity conditions that create avoidable conflict
    - scaling should add capability and optionality without recreating opaque institutions, extraction, or dependency capture
    - new problems should be discovered by the model rather than preloaded from assumptions about shared living as inherently adversarial
  boundary_services: [legal_boundary, consent_boundary, safety_boundary, rights_boundary, external_review_boundary]
  scope_rule: Apply abundance-first, low-coercion design at village, district, town, city, and regional scopes; centralize only capabilities that truly benefit from scale.
  provisional: true
interface_bundles:
  review_gate:
    description: Shared external review and stop-condition contract for legal, engineering, public-health, safety, and professional review boundaries.
    interfaces:
      - review_dependencies
      - review_status_dashboard
      - professional_escalation_path
      - stop_condition_policy
  labor_visibility:
    description: Shared labor accounting contract for build, operations, maintenance, emergency, learning, and governance burden.
    interfaces:
      - labor_hours_per_week
      - build_labor_hours
      - recurring_labor_hours_per_week
      - labor_burden_report
  privacy_boundary:
    description: Shared privacy contract for aggregate visibility without exposing resident-level health, conflict, disability, hardship, or participation details.
    interfaces:
      - privacy_policy
      - sensitive_data_boundary
      - aggregate_visibility
      - resident_level_access_rule
  role_backup_coverage:
    description: Shared stewardship contract for named roles, backups, handoff records, rotation limits, and expert-capture prevention.
    interfaces:
      - stewardship_role
      - backup_role
      - role_rotation_policy
      - handoff_record
  dashboard_export:
    description: Shared inspectability contract for member-visible dashboards, machine-readable exports, logs, and incident records.
    interfaces:
      - member_visible_dashboard
      - machine_readable_export
      - incident_log
      - decision_log
  scenario_resilience:
    description: Shared resilience contract for service levels, emergency modes, scenario tests, recovery playbooks, and after-action learning.
    interfaces:
      - service_level_table
      - scenario_library
      - emergency_mode_defined
      - recovery_playbook
      - after_action_review
  anti_capture_due_process:
    description: Shared rights and anti-capture contract for appeals, anti-retaliation, external escalation, and bounded authority.
    interfaces:
      - appeal_process
      - anti_retaliation_policy
      - authority_limit
      - external_escalation_path
module_tiers:
  floor_systems: [housing, potable_water_source, food_production, critical_energy, sanitation]
  operating_systems: [maintenance_repair, governance_anticapture, labor_time, legal_land_finance]
  capacity_systems: [materials_fabrication, mobility_access, education_skill, social_cultural_commons]
  meta_systems: [risk_resilience]
