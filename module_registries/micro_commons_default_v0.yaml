    accepted_patterns: [dignified_village_block]
    dignity_floor_resources: [shelter, privacy]
    swap_policy: adapter_required
    accepted_module_domains: [housing, shelter, commons, construction, accessibility]
    required_interface_bundles: [review_gate, labor_visibility, privacy_boundary, role_backup_coverage]
    required_interfaces:
      - residents_per_block
      - private_unit_mix
      - common_space_ratio
      - privacy_score
      - accessibility.review_dependency
      - structural.review_dependency
      - labor_hours_per_week
    scaling_basis: people_pods_and_blocks
    node_policy:
      scale_unit: residents
      minimum_population_per_node: 5
      preferred_population_per_node: 80
      maximum_population_per_node: 150
      scale_down_strategy: use dwelling and pod-scale starter housing before activating a full village block
      scale_up_strategy: replicate village housing blocks with their own common-house and service spine
      stateful: true
      provisional: true
    research_queries:
