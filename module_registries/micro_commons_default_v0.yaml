research_scan_policy:
  recency_preference_years: 10
  accepted_sources: [peer_reviewed_paper, systematic_review, meta_analysis, standards_body_report]
  required_metadata: [title, authors, year, doi_or_url, study_context, sample_size_or_scale, performance_statistics, limitations]
  planning_phase_role: find candidate plans, extract claims, map statistics to module interfaces, preserve uncertainty and provenance
  human_review_role: approve module promotion beyond evidence_seed
  provisional: true
scaling_policy:
  required_targets: [12, 150, 1500]
  preserve_dignity_floors: true
  prefer_additive_research_modules: true
  notes: Research modules should scale through explicit interfaces, not hidden reductions in consumption or comfort.
  provisional: true
unknowns:
  - Planning-phase research can miss or misread plans and papers; extracted claims must keep citations and uncertainty.
  - Drag-and-drop compatibility means simulation compatibility, not legal, engineering, health, or construction approval.
  - Many promising technologies need adapter models before they can affect CIaC resource flows.
