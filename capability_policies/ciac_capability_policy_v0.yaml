      capability_field: care_health.care_continuity_protocol_supported
      pass_condition: {all: [{field: care_health.care_continuity_protocol_supported, equals: true}]}
      warn_condition: {any: [{field: care_health.care_continuity_protocol_supported, not_equals: true}]}
      fail_condition: {}
      promotion_block_condition: {}
      messages: {pass: Care continuity is explicitly modeled., warn: Care continuity protocol is not explicitly supported., fail: Care continuity is absent for an active care claim., promotion_blocked: Care continuity review blocks promotion., unknown: Care continuity status is unknown.}
