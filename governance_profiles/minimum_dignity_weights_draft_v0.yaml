  - objective: reduce_recurring_labor
    weight: 0.2
    status: draft
    rationale: Labor burden is weighted strongly because fragile systems that survive by hidden work are not repeatable.
    provisional: true
  - objective: reduce_cost
    weight: 0.15
    status: draft
    rationale: Cost matters for repeatability, but provisional cost proxies must not override survival demand or hidden labor.
    provisional: true
  - objective: reduce_review_burden
    weight: 0.1
    status: draft
    rationale: Review burden matters as a planning signal, but review locks must remain visible rather than optimized away.
