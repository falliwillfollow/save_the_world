      source_ids: [CDC_DISABILITY_EMERGENCY_KIT, HRSA_HEALTH_CENTER_PROGRAM]
    - gate_id: high_need_support_coverage
      capability_field: care_health.high_need_support_coverage
      pass_condition: {all: [{field: care_health.high_need_support_coverage, min: 1.0}]}
      warn_condition: {any: [{field: care_health.high_need_support_coverage, below: 1.0}]}
