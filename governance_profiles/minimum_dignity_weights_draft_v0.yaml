approval_gates:
  - id: resident_weight_ratification
    required_status: ratified
    description: Residents or their legitimate governance process must ratify objective weights before real-world recommendation.
    provisional: true
  - id: professional_review_acceptance
    required_status: accepted
    description: Relevant professional review must accept that objective formulas are appropriate for the stated use.
    provisional: true
  - id: no_rejected_weights
    required_status: no_rejected
