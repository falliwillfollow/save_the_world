warnings:
  residential_pod_over_soft: Residential pod is exceeding comfortable cluster size. Add another pod or subdivide.
  common_house_over_soft: Common house is approaching institutional scale. Add neighborhood commons or meal waves.
  food_node_over_soft: Food commons is approaching kitchen/labor bottleneck. Duplicate pickup/kitchen capacity.
  kitchen_food_safety_review: Shared kitchen complexity requires food-safety review, logs, allergen controls, and trained backup.
  meal_radius_warning: Food access exceeds walk/roll threshold for high-need residents. Add meal pickup or delivery node.
  water_review_trigger: Population may trigger public-water-system review. Require legal/public-health review.
  water_reserve_warning: Emergency potable water reserve is below CIaC floor or not accessible to all residents.
  sanitation_access_warning: Toilets or hygiene access are using emergency-minimum logic or exceed dignity thresholds.
  blackwater_review_fail: Blackwater system lacks approved design, maintenance, or professional/public-health review.
  care_node_warning: Care access, privacy, or illness separation may require another care room.
  medication_continuity_fail: Medication continuity or refrigerated medication backup is not protected.
  high_need_support_fail: High-need resident support is not adequately local, private, or backed up.
  governance_over_soft: Direct assembly burden rising. Federate into circles or delegated roles.
  governance_circle_large: Operational circle is becoming too large for consent or effective stewardship. Split or delegate roles.
  governance_capture: Governance capture risk; one role or group controls too many high-power functions.
  maintenance_bottleneck: One workshop/tool node is serving too many residents. Add local tool cache or district workshop.
  mobility_distance_warning: Essential daily functions exceed walk/roll threshold, especially for high-need residents.
  training_group_too_large: Training group is too large for hands-on safety or skill acquisition.
  skill_backup_missing: Critical skill has no backup or apprentice pipeline.
  quiet_space_missing: No low-social-energy retreat space is available at this scale.
  resilience_single_point_failure: Critical function depends on one node, role, or external provider.
  reserve_topology_risk: Reserve is centralized, inaccessible, or lacks replenishment/distribution plan.
  fallback_dependency: Fallback system is too dependent on the normal system it is meant to replace.
  emergency_governance_risk: Emergency authority lacks backup, sunset, or anti-capture controls.
unknowns:
  - Policy thresholds are research-derived heuristics, not final professional certification.
  - Site, climate, legal jurisdiction, building code, water rights, and household composition can move thresholds.
  - Emergency minimums are retained for stress testing and must not be treated as normal dignified design targets.
