    capability_fields: [risk_resilience.hazard_register_supported, risk_resilience.dependency_graph_supported, risk_resilience.dependency_graph_coverage, risk_resilience.recovery_playbook_count, risk_resilience.scenario_coverage_count, risk_resilience.graceful_degradation_supported]
    required_structures: [hazard_register, dependency_graph, critical_function_map, recovery_playbook_library, service_level_matrix]
    required_protocols: [annual_risk_review, scenario_run_schedule, after_action_review, reserve_replenishment]
    external_review_blockers: [emergency_management_review, fire_EMS_review, public_health_review, insurance_review]
    scenarios: [risk_resilience_compound_failure]
    ui_warnings: [hazard_register_missing]
    gates:
    - gate_id: hazard_register
      capability_field: risk_resilience.hazard_register_supported
      pass_condition: {all: [{field: risk_resilience.hazard_register_supported, equals: true}]}
      warn_condition: {any: [{field: risk_resilience.hazard_register_supported, not_equals: true}]}
      fail_condition: {}
      promotion_block_condition: {any: [{field: risk_resilience.hazard_register_supported, not_equals: true}]}
      messages: {pass: Hazard register is explicitly supported., warn: Hazard register is not explicitly supported., fail: No hazard register exists., promotion_blocked: Missing hazard register blocks resilience claims., unknown: Hazard register status is unknown.}
      evidence_quality: high
      translation_confidence: high
      regulatory_strength: guideline
      source_ids: [NIST_COMMUNITY_RESILIENCE_GUIDE, FEMA_NATIONAL_RESILIENCE_GUIDANCE]
    - gate_id: dependency_graph
      capability_field: risk_resilience.dependency_graph_supported
      pass_condition: {all: [{field: risk_resilience.dependency_graph_supported, equals: true}, {field: risk_resilience.dependency_graph_coverage, min: 1.0}]}
      warn_condition: {any: [{field: risk_resilience.dependency_graph_supported, not_equals: true}, {field: risk_resilience.dependency_graph_coverage, below: 1.0}]}
      fail_condition: {}
      promotion_block_condition: {any: [{field: risk_resilience.dependency_graph_supported, not_equals: true}]}
      messages: {pass: Dependency graph is complete enough for the modeled floor., warn: Dependency graph support or coverage is incomplete., fail: Critical functions are untraceable., promotion_blocked: Missing dependency graph blocks system claims., unknown: Dependency graph status is unknown.}
      evidence_quality: high
      translation_confidence: high
      regulatory_strength: guideline
      source_ids: [NIST_COMMUNITY_RESILIENCE_GUIDE]
    - gate_id: recovery_playbooks
      capability_field: risk_resilience.recovery_playbook_count
      pass_condition: {all: [{field: risk_resilience.recovery_playbook_count, min: 8}]}
      warn_condition: {any: [{field: risk_resilience.recovery_playbook_count, min: 4}, {field: risk_resilience.recovery_playbook_count, below: 4}]}
      fail_condition: {}
      promotion_block_condition: {}
      messages: {pass: Recovery playbook count meets the v0 target., warn: Recovery playbook count is below the v0 target., fail: Recovery playbooks are below the minimum floor., promotion_blocked: Missing recovery playbooks block resilience claims., unknown: Recovery playbook count is unknown.}
      evidence_quality: high
      translation_confidence: moderate
      regulatory_strength: guideline
      source_ids: [NIST_COMMUNITY_RESILIENCE_GUIDE, FEMA_NATIONAL_RESILIENCE_GUIDANCE]
    - gate_id: graceful_degradation
      capability_field: risk_resilience.graceful_degradation_supported
      pass_condition: {all: [{field: risk_resilience.graceful_degradation_supported, equals: true}]}
      warn_condition: {any: [{field: risk_resilience.graceful_degradation_supported, not_equals: true}]}
      fail_condition: {}
      promotion_block_condition: {}
      messages: {pass: Graceful degradation is explicitly supported., warn: Graceful degradation is not explicitly supported., fail: No rationing or fallback logic exists., promotion_blocked: Missing degradation logic blocks resilience claims., unknown: Graceful degradation status is unknown.}
      evidence_quality: high
      translation_confidence: moderate
      regulatory_strength: guideline
      source_ids: [NIST_COMMUNITY_RESILIENCE_GUIDE, SENDAI_FRAMEWORK]
  labor_time:
    capability_fields: [labor_time.commons_labor_hours_per_resident_per_week, labor_time.hidden_labor_tracking_supported, labor_time.free_time_increase_supported, labor_time.required_wage_hours_reduction_percent]
    required_structures: [labor_ledger, role_scheduler, hidden_labor_tracker, protected_time_dashboard, training_gate_matrix]
    required_protocols: [weekly_labor_accounting, monthly_fairness_audit, labor_concentration_review, optional_vs_required_labor_classifier]
    external_review_blockers: [employment_labor_review_if_work_is_required_or_paid, disability_accommodation_review, privacy_review_for_labor_data]
    scenarios: [labor_time_hidden_burden]
    ui_warnings: [hidden_labor, free_time_not_proven]
    gates:
    - gate_id: commons_labor_upper_bound
      capability_field: labor_time.commons_labor_hours_per_resident_per_week
      pass_condition: {all: [{field: labor_time.commons_labor_hours_per_resident_per_week, max: 8}, {field: labor_time.commons_labor_hours_per_resident_per_week, above: 0}]}
      warn_condition: {any: [{field: labor_time.commons_labor_hours_per_resident_per_week, equals: 0}, {field: labor_time.commons_labor_hours_per_resident_per_week, above: 8}]}
      fail_condition: {any: [{field: labor_time.commons_labor_hours_per_resident_per_week, above: 12}]}
      promotion_block_condition: {}
      messages: {pass: Commons labor is tracked and within the v0 upper bound., warn: Commons labor is either unmeasured or above the preferred bound., fail: Commons labor exceeds the blocking threshold., promotion_blocked: Labor burden blocks life-burden claims., unknown: Commons labor burden is unknown.}
      evidence_quality: moderate
      translation_confidence: moderate
      regulatory_strength: heuristic
      source_ids: [BLS_ATUS_2024, WHO_ILO_LONG_WORKING_HOURS, OECD_WORK_LIFE_BALANCE]
    - gate_id: hidden_labor_tracking
      capability_field: labor_time.hidden_labor_tracking_supported
      pass_condition: {all: [{field: labor_time.hidden_labor_tracking_supported, equals: true}]}
      warn_condition: {any: [{field: labor_time.hidden_labor_tracking_supported, not_equals: true}]}
      fail_condition: {}
      promotion_block_condition: {any: [{field: labor_time.hidden_labor_tracking_supported, not_equals: true}]}
      messages: {pass: Hidden labor tracking is explicitly supported., warn: Hidden labor tracking is not explicitly supported., fail: Savings depend on hidden or untracked labor., promotion_blocked: Hidden labor risk blocks life-burden claims., unknown: Hidden labor tracking status is unknown.}
      evidence_quality: high
      translation_confidence: high
      regulatory_strength: research_inferred
      source_ids: [BLS_ATUS_2024, OECD_WORK_LIFE_BALANCE]
    - gate_id: free_time_improvement
      capability_field: labor_time.free_time_increase_supported
      pass_condition: {all: [{field: labor_time.free_time_increase_supported, equals: true}, {field: labor_time.required_wage_hours_reduction_percent, min: 25}]}
      warn_condition: {any: [{field: labor_time.free_time_increase_supported, not_equals: true}, {field: labor_time.required_wage_hours_reduction_percent, below: 25}]}
      fail_condition: {}
      promotion_block_condition: {}
      messages: {pass: Free-time and wage-hour improvement are explicitly supported., warn: Free-time or wage-hour reduction is not demonstrated., fail: Life-burden reduction is contradicted by labor data., promotion_blocked: Missing baseline blocks liberated-time claims., unknown: Free-time improvement status is unknown.}
      evidence_quality: moderate
      translation_confidence: moderate
      regulatory_strength: heuristic
      source_ids: [BLS_ATUS_2024, WHO_ILO_LONG_WORKING_HOURS, UKRI_FOUR_DAY_WEEK]
promotion_blockers:
- id: no_high_need_support_model
  domain: care_health
  severity: block
  description: High-need support is not modeled to the policy threshold.
- id: no_accessible_route_to_essentials
  domain: mobility_access
  severity: block
  description: Essential accessible route coverage is incomplete.
- id: no_reviewed_sanitation_path
  domain: sanitation
  severity: block
  description: Sanitation access, wastewater path, worker safety, or emergency fallback is not explicit enough.
- id: no_due_process
  domain: governance_anticapture
  severity: block
  description: Commons decision process lacks due process.
- id: no_written_resident_rights_or_tenure
  domain: legal_land_finance
  severity: block
  description: Resident rights or land tenure are not explicit enough.
- id: no_hazard_register_or_dependency_graph
  domain: risk_resilience
  severity: block
  description: Resilience claim lacks hazard register or dependency graph.
- id: safety_critical_task_without_training_gate
  domain: labor_time
  severity: block
  description: Safety-critical task has no training gate.
scenario_requirements:
  care_health: {required: [injury_event, medication_refrigeration_outage, illness_wave, high_need_evacuation, care_steward_exit, care_labor_burnout]}
  sanitation: {required: [normal_hygiene_day, illness_wave_sanitation_surge, wastewater_failure, hazardous_waste_mixing, emergency_toilet_fallback, sanitation_labor_burnout]}
  governance_anticapture: {required: [member_expulsion_case, emergency_power_extension, founder_exit, admin_capture, major_debt_or_land_sale, privacy_breach]}
  mobility_access: {required: [wheelchair_resident_day, elder_pharmacy_trip, fire_EMS_access, route_blockage, no_private_car_resident, shared_vehicle_failure]}
  legal_land_finance: {required: [income_loss, reserve_drawdown, insurance_shock, debt_pressure, resident_exit, land_sale_pressure]}
  risk_resilience: {required: [water_contamination, 72_hour_energy_outage, food_disruption, illness_wave, fire_or_shelter_loss, financial_shock, compound_heat_grid_outage]}
  labor_time: {required: [normal_week, bad_week, hidden_labor_detection, care_labor_concentration, governance_conflict_month, maintenance_emergency, scale_80_300_730_1500]}
ui_warnings:
  care_no_external_path:
    domain: care_health
    severity: warn
    message: Care room lacks a clear external professional care path. This remains simulation-only.
  illness_wave_unready:
    domain: care_health
    severity: warn
    message: Illness-wave protocol lacks meal delivery, sanitation escalation, or privacy protection.
  sanitation_review_missing:
    domain: sanitation
    severity: warn
    message: Sanitation requires local code, wastewater, worker-safety, public-health, and hazardous-waste review before real-world use.
  wastewater_path_missing:
    domain: sanitation
    severity: fail
    message: Blackwater path or greywater boundary is not explicit.
  dirty_labor_hidden:
    domain: sanitation
    severity: warn
    message: Sanitation exposure and dirty labor must be trained, visible, rotated, and backed up.
  governance_due_process_missing:
    domain: governance_anticapture
    severity: fail
    message: Commons decision lacks notice, review, appeal, or recordkeeping.
  emergency_power_no_sunset:
    domain: governance_anticapture
    severity: block
    message: Emergency authority has no sunset. Promotion blocked.
  accessible_route_gap:
    domain: mobility_access
    severity: fail
    message: Essential route coverage is below the 100 percent accessibility target.
  non_driver_exclusion:
    domain: mobility_access
    severity: fail
    message: Non-drivers cannot access daily needs without informal help.
  tenure_insecure:
    domain: legal_land_finance
    severity: fail
    message: Resident rights or land tenure are not explicit enough to pass.
  reserve_shortfall:
    domain: legal_land_finance
    severity: warn
    message: Reserves are missing or excluded from affordability. Cost model is not credible.
  hazard_register_missing:
    domain: risk_resilience
    severity: block
    message: Hazard register or dependency graph is missing. Resilience claim blocked.
  hidden_labor:
    domain: labor_time
    severity: fail
    message: Savings appear to depend on hidden or untracked labor.
  free_time_not_proven:
    domain: labor_time
    severity: warn
    message: Life burden reduction is not proven because free time or wage-hour reduction is not demonstrated.
unknowns:
- Capability policy results are provisional modeling aids, not real-world certification.
- Missing external review is treated as simulation-only or review-blocked, not as proof of invalidity.
