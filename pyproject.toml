[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ciac"
version = "0.1.0"
description = "Civic Infrastructure as Code schema, pattern, compiler, and gate foundation."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.scripts]
ciac = "ciac.cli:main"

